<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legalhubly — Find the Right Chicago Lawyer Faster</title>
    <meta
      name="description"
      content="Legalhubly is the AI-powered legal marketplace for Chicago. Describe your issue, get matched to verified lawyers instantly, then connect — free to start."
    />
    <meta
      name="keywords"
      content="Legalhubly, Legalhubly website, find a lawyer Chicago, Chicago attorney, AI lawyer match, legal marketplace Chicago, book lawyer consultation"
    />
    <meta name="author" content="Legalhubly" />
    <meta name="application-name" content="Legalhubly" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://www.legalhubly.com/" />
    <link rel="preconnect" href="https://ubljuduaxtdojaaggqpw.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ubljuduaxtdojaaggqpw.supabase.co" />

    <!-- Brand LH monogram — cache-busted so Google drops old Lovable favicon -->
    <link rel="icon" href="/favicon.ico?v=lh2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=lh2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png?v=lh2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png?v=lh2" />
    <link rel="shortcut icon" href="/favicon.ico?v=lh2" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Legalhubly" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.legalhubly.com/" />
    <meta property="og:title" content="Legalhubly — Find the Right Chicago Lawyer Faster" />
    <meta
      property="og:description"
      content="Describe your legal issue. AI matches you to Chicago lawyers. Connect — profiles, ratings, book consultation. Free to start."
    />
    <meta property="og:image" content="https://www.legalhubly.com/brand/logo-lockup.png" />
    <meta property="og:image:alt" content="Legalhubly logo" />

    <!-- Twitter / Safari share -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Legalhubly — Find the Right Chicago Lawyer Faster" />
    <meta
      name="twitter:description"
      content="AI-powered Chicago legal marketplace. Describe → Match → Connect with verified lawyers."
    />
    <meta name="twitter:image" content="https://www.legalhubly.com/brand/logo-lockup.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.legalhubly.com/#organization",
            "name": "Legalhubly",
            "alternateName": ["Legal Hubly", "Legalhubly.com"],
            "url": "https://www.legalhubly.com/",
            "logo": "https://www.legalhubly.com/brand/logo-mark.png",
            "image": "https://www.legalhubly.com/brand/logo-lockup.png",
            "description": "AI-powered legal marketplace connecting clients with verified Chicago lawyers.",
            "areaServed": {
              "@type": "City",
              "name": "Chicago",
              "containedInPlace": { "@type": "State", "name": "Illinois" }
            },
            "sameAs": [
              "https://www.linkedin.com/company/legalhubly"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.legalhubly.com/#website",
            "url": "https://www.legalhubly.com/",
            "name": "Legalhubly",
            "alternateName": "Legalhubly Website",
            "description": "Find the right Chicago lawyer faster with AI matching.",
            "publisher": { "@id": "https://www.legalhubly.com/#organization" },
            "inLanguage": "en-US",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.legalhubly.com/client/find-lawyers?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "WebApplication",
            "name": "Legalhubly",
            "url": "https://www.legalhubly.com/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free to search and get matched with Chicago lawyers"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
